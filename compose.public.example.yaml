# EXAMPLE ONLY: do not deploy while production gate is NO_GO.
# Standalone Compose file. Prepare the sanitized snapshot offline.
services:
  portal:
    build:
      context: .
      target: public
    restart: "no"
    environment:
      DIREITO_PUBLIC_READ_ONLY: "1"
      DIREITO_DEPLOYMENT_MODE: staging
      DIREITO_DATABASE: /srv/public-data/public.sqlite3
    volumes:
      - type: bind
        source: ./public-data/public.sqlite3
        target: /srv/public-data/public.sqlite3
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8088:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
