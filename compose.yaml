services:
  portal:
    build:
      context: .
      target: development
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - direito_data:/var/lib/direito
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    mem_limit: 512m
volumes:
  direito_data:
