# Standalone loopback TLS rehearsal. Production gate remains NO_GO.
services:
  portal:
    build:
      context: .
      target: public
    restart: "no"
    environment:
      DIREITO_PUBLIC_READ_ONLY: "1"
      DIREITO_DEPLOYMENT_MODE: staging
      DIREITO_DATABASE: /srv/public-data/public.sqlite3
      FORWARDED_ALLOW_IPS: 172.31.240.2
    volumes:
      - type: bind
        source: ./public-data/public.sqlite3
        target: /srv/public-data/public.sqlite3
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    networks: [backend]

  proxy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    user: "10001:10001"
    restart: "no"
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ./Caddyfile.local.example
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    networks:
      backend:
        ipv4_address: 172.31.240.2
      edge: {}

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/29
  edge: {}
